# Builds the Windows installer (.msi).
#   - Push a tag like v0.4.0 -> builds and publishes a GitHub Release with the .msi attached.
#   - Run manually (Actions tab -> Release -> Run workflow) -> builds the .msi as a downloadable artifact only.
#
# Supply-chain hygiene: actions are pinned to commit SHAs (Dependabot proposes updates), the build
# checks every dependency's PGP signature against src/main/packaging/pgp-keys.list (see pom.xml),
# the build job only gets a read-only token, and the release job, which runs no build code,
# publishes the .msi with a signed build-provenance attestation (GitHub lists each asset's SHA-256
# on the release page itself). Anyone can check that an installer was built here from this repo's
# source with:
#   gh attestation verify "YT.Music-<version>.msi" --repo bauschspencer/yt-music-desktop
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release builds from a clean download.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'

      # The image ships WiX Toolset 3.x but doesn't put it on PATH; jpackage needs candle/light.
      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          if (-not $wix) { throw 'WiX Toolset not found on this runner image' }
          "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "Using $($wix.FullName)"

      - name: Check tag matches pom version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          # Passed as data, not pasted into the script: a tag name can contain quotes.
          TAG: ${{ github.ref_name }}
        run: |
          # Quoted: PowerShell would otherwise split the -D argument at the dot.
          $version = mvn -q help:evaluate "-Dexpression=project.version" -DforceStdout
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG doesn't match pom.xml version $version. Bump <version> in pom.xml first."
          }

      # --strict-checksums: fail on any dependency whose checksum doesn't match Maven Central's.
      # The PGP signature check (pom.xml) fetches the pinned keys from public keyservers; if one is
      # down, re-run the job.
      - name: Build installer
        run: mvn -B --strict-checksums package -Pinstaller

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YT-Music-installer
          path: target/installer/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Create the release.
      id-token: write      # Sign the attestation...
      attestations: write  # ...and store it.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: YT-Music-installer
          path: installer

      # GitHub replaces spaces in asset names with dots; rename first, so the attestation names the
      # file people actually download (YT.Music-<version>.msi).
      - name: Name the installer as GitHub will
        working-directory: installer
        run: for f in *.msi; do [ "$f" = "${f// /.}" ] || mv -- "$f" "${f// /.}"; done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/*.msi

      - name: Publish release
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes *.msi
